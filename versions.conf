# shellcheck shell=bash
# ============================================================================
#  versions.conf  ——  版本与安装形式清单 (Version & Mode Manifest)
# ----------------------------------------------------------------------------
#  这是整个安装器的核心：所有“可选版本”都在这里声明。
#  想新增一个版本，只需在对应的数组里加一行，无需改动任何模块脚本。
#
#  This is the heart of the installer. Every selectable version is declared
#  here. To add a new version, just add one line to the matching array —
#  no module code needs to change.
#
#  字段说明 / Field format:  "版本号|安装形式(逗号分隔)|额外参数..."
#  Each entry:               "VERSION|MODES(comma separated)|extra meta..."
# ============================================================================

# ---------------------------------------------------------------------------
# Nginx / Tengine （同属 Web 服务器组件，二选一，互斥）
#   modes:  source = 源码编译 (compile)   |   pkg = 包管理器安装
#   meta :  flavor=nginx|tengine ; openssl/pcre/zlib 编译依赖版本 ;
#           modules=附加 configure 参数(多个用逗号分隔，仅 source 形式生效)
#   说明 :  源码编译会保留原仓库对源码的优化(IIS 伪装、autoindex 文件名长度等)。
#           Tengine 为 nginx 增强发行版；本条按需求开启 --with-http_upstream_check_module。
# ---------------------------------------------------------------------------
NGINX_VERSIONS=(
  "1.30.6|source,pkg|flavor=nginx;openssl=3.5.9;pcre=pcre2-10.47;zlib=1.3.2"
  "1.26.2|source,pkg|flavor=nginx;openssl=3.5.9;pcre=pcre2-10.47;zlib=1.3.2"
  # 注意：tengine 3.x 的 modules/ 目录里已经没有 upstream_check 模块
  # （只剩 vnswrr / user_agent / xquic / ingress / multi_upstream / slab_stat / tongsuo_ntls），
  # 老文档里的 --with-http_upstream_check_module 在 3.1.0 会直接
  # "invalid option" 让 configure 失败。别再抄 2.x 的参数。
  "tengine-3.1.0|source|flavor=tengine;openssl=3.5.9;pcre=pcre2-10.47;zlib=1.3.2"
  "freenginx-1.31.4|source|flavor=freenginx;openssl=3.5.9;pcre=pcre2-10.47;zlib=1.3.2"
  "freenginx-1.30.1|source|flavor=freenginx;openssl=3.5.9;pcre=pcre2-10.47;zlib=1.3.2"
)
NGINX_DEFAULT="1.30.6"
NGINX_DEFAULT_MODE="source"

# ---------------------------------------------------------------------------
# Apache (httpd)
#   modes:  source = 源码编译   |   pkg = 包管理器安装
#   meta :  mpm=prefork/event ; http2=on/off ; apr / apr-util 版本
# ---------------------------------------------------------------------------
APACHE_VERSIONS=(
  "2.4.69|source,pkg|mpm=event;http2=on;apr=1.7.4;aprutil=1.6.3;openssl=3.5.9"
)
APACHE_DEFAULT="2.4.69"
APACHE_DEFAULT_MODE="source"

# ---------------------------------------------------------------------------
# PHP
#   modes:  fpm    = php-fpm，配合 Nginx 使用
#           apache = mod_php，作为 Apache 模块运行
#   meta :  openssl 依赖版本 ; min_mem 最低内存(MB) ; ext 扩展系列(信息用)
#           mcrypt=on 时(仅 PHP5.6)会尝试启用 --with-mcrypt ; phpredis=随该 PHP 推荐的扩展版本
#   说明 :  安装 PHP 时会自动编译常用的 phpredis 扩展。
#
#   ★ PHP 5.6.40 （5.6 分支最后一版, 2019-01-10 发布, 官方已 EOL）
#     与 7.x/8.x 的构建差异（模块 php.sh 已自动处理）：
#       · 必须链接 OpenSSL 1.0.2（不能用 OpenSSL 3.x），故单独编译到
#         ${PREFIX_OPENSSL_10}，与 nginx/apache 使用的共享 OpenSSL3 互不干扰；
#       · 不支持 sodium / argon2（PHP7.2+ 才有），自动跳过这两项依赖与编译开关；
#       · 使用旧式 GD / zip / libxml 开关，并启用 mcrypt（若系统提供 libmcrypt）；
#         旧式 GD 显式给出 --with-jpeg-dir=/usr 等目录(否则会静默不编译 JPEG，
#         导致 imagejpeg 缺失、依赖缩略图的程序报 500)；WebP 经 libvpx(--with-vpx-dir)
#         在装有 libvpx-devel 时自动启用；
#       · 现代 GCC(≥10) 默认 -fno-common 会导致 5.6 编译失败，自动追加 -fcommon；
#       · intl 因系统 ICU 过新与 5.6 不兼容，5.6 下不启用 intl。
#     最适合的运行环境是 CentOS/RHEL 7；在 Rocky/Alma 8/9、Ubuntu 22/24 上为
#     尽力而为(best-effort)，仅建议在必须承载老旧遗留应用时选用。
# ---------------------------------------------------------------------------
PHP_VERSIONS=(
  "8.5.12|fpm,apache|openssl=3.5.9;min_mem=2000;ext=8;phpredis=6.3.0"
  "8.4.27|fpm,apache|openssl=3.5.9;min_mem=2000;ext=8;phpredis=6.3.0"
  "8.3.36|fpm,apache|openssl=3.5.9;min_mem=2000;ext=8;phpredis=6.3.0"
  "8.2.35|fpm,apache|openssl=3.5.9;min_mem=2000;ext=8;phpredis=6.3.0"
  # PHP 7.x 必须配 OpenSSL 1.1.1：3.x 把 EVP_PKEY_get0_RSA 等 API 的返回值加了
  # const 限定，7.4 的 ext/openssl 直接编译失败（"discards const qualifier"）。
  # 完整支持 OpenSSL 3 的是 8.1+，所以 8.x 用 3.5.9、7.x 用 1.1.1w。
  "7.4.33|fpm,apache|openssl=1.1.1w;min_mem=0;ext=7;phpredis=5.3.7"
  "5.6.40|fpm,apache|openssl=1.0.2u;min_mem=0;ext=5;mcrypt=on;phpredis=4.3.0"
)
PHP_DEFAULT="8.5.12"
PHP_DEFAULT_MODE="fpm"

# PHP 5.6 专用 OpenSSL 1.0.2 独立安装前缀（与共享 /usr/local/openssl 隔离，避免冲突）
PREFIX_OPENSSL_10="/usr/local/openssl-1.0"
# PHP 7.x 专用 OpenSSL 1.1.1（soname libssl.so.1.1，与 3.x 的 .so.3 并存不冲突）
PREFIX_OPENSSL_11="/usr/local/openssl-1.1"

# ImageMagick(imagick) 扩展版本（可选安装；适配所有 PHP 版本）
#   PHP 7.4–8.3 用 3.7.0（兼容 ImageMagick 6/7）
#   PHP 8.4/8.5 用 3.8.1（最新稳定版，支持 PHP 8.5 与 ImageMagick 7.1.2-x）
#   注：imagick 可链接系统 ImageMagick 7；但 IM 官方对 PHP 扩展仍推荐 IM6 以求最大兼容。
IMAGICK_VERSION="3.7.0"
IMAGICK_VERSION_PHP84="3.8.1"

# 可选：从源码编译 ImageMagick（而非用发行版包）。版本与安装前缀。
IMAGEMAGICK_VERSION="7.1.2-34"
PREFIX_IMAGEMAGICK="/usr/local/imagemagick"

# phpMyAdmin（可选安装到默认站点 ${WWWROOT}/web/phpMyAdmin）
#   仅保留 5.2.3（需 PHP 7.2+，覆盖本项目所有 PHP 版本）
PMA_VERSION="5.2.3"

# Adminer（可选；轻量级单文件数据库管理工具，phpMyAdmin 的轻量替代）
ADMINER_VERSION="5.4.2"

# Java(OpenJDK 11/17, Temurin) + Tomcat（可选）
PREFIX_JAVA="/usr/local/java"
PREFIX_TOMCAT="/usr/local/tomcat"
TOMCAT_VERSION="10.1.55"

# ---------------------------------------------------------------------------
# MySQL
#   modes:  source = 源码编译(cmake)   |   binary = 官方二进制包   |   pkg = 包管理器仓库
#   meta :  boost 是否需要 ; min_mem 最低内存(MB) ; glibc 二进制包 glibc 标记 ; ext 二进制包后缀
#   说明 :  MySQL 8.x 二进制包为 .tar.xz；8.x 源码编译需 C++17 工具链(EL7 默认 gcc 过旧)，
#           故 8.x 仅提供 binary / pkg 两种形式。
# ---------------------------------------------------------------------------
MYSQL_VERSIONS=(
  "9.7.4|binary,pkg|boost=off;min_mem=1000;glibc=glibc2.28;ext=tar.xz;lts=yes"
  "8.4.13|binary,pkg|boost=off;min_mem=1000;glibc=glibc2.28;ext=tar.xz;lts=yes"
  "8.0.46|binary,pkg|boost=off;min_mem=1000;glibc=glibc2.17;ext=tar.xz"
  "5.7.44|source,binary,pkg|boost=on;min_mem=2000;glibc=glibc2.12;ext=tar.gz"
)
# 默认 8.4 而不是 9.7：8.4 是当前最稳的 LTS，生态（phpMyAdmin/各类 ORM/备份工具）
# 对它兼容最完整；9.7 属于较新的创新版本线，需要时显式 --mysql 9.7.4。
MYSQL_DEFAULT="8.4.13"
MYSQL_DEFAULT_MODE="binary"

# ---------------------------------------------------------------------------
# MariaDB （与 MySQL 同为数据库，二选一，互斥）
#   modes:  binary = 官方二进制包(linux-systemd, .tar.gz)   |   pkg = 官方仓库/发行版包
#   meta :  min_mem 最低内存(MB) ; glibc = 二进制包要求的 glibc 下限
#           (precheck 会拿它和本机 ldd --version 比对，避免装完才发现
#            GLIBC_2.28 not found。11.x 二进制包基于新工具链构建，需 2.28+；
#            10.11 仍兼容 CentOS 7 时代的 2.17)
#   说明 :  MariaDB 11.x 源码编译需较新工具链，这里提供 binary / pkg 两种形式。
#           二进制包目录形如 mariadb-<ver>-linux-systemd-x86_64。
# ---------------------------------------------------------------------------
# MariaDB 按 LTS 分支分类（每年一个 LTS，社区版支持 3 年）：
#   11.8 = 当前 LTS(2025, 推荐, 支持到 2028)；11.4 = 上一 LTS(2024)；10.11 = 维护中 LTS
#   (10.6 LTS 于 2026-07 EOL，已不再纳入)
MARIADB_VERSIONS=(
  "11.8.8|binary,pkg|min_mem=1000;glibc=glibc2.28;lts=2025"
  "11.4.8|binary,pkg|min_mem=1000;glibc=glibc2.28;lts=2024"
  "10.11.14|binary,pkg|min_mem=1000;glibc=glibc2.17;lts=2023"
)
MARIADB_DEFAULT="11.8.8"
MARIADB_DEFAULT_MODE="binary"

# ---------------------------------------------------------------------------
# Redis （内存数据库 / 缓存）
#   modes:  source = 源码编译(安装到 /usr/local/redis)   |   pkg = 包管理器安装
#   meta :  min_mem 最低内存(MB)
#   说明 :  安装 PHP 时会自动编译 phpredis 扩展，无需在此单独选择。
# ---------------------------------------------------------------------------
REDIS_VERSIONS=(
  "8.10.2|source|min_mem=0"
  "8.8.3|source|min_mem=0"
  "7.4.9|source,pkg|min_mem=0"
  "6.2.24|source,pkg|min_mem=0"
)
REDIS_DEFAULT="8.10.2"
REDIS_DEFAULT_MODE="source"

# ---------------------------------------------------------------------------
# phpredis （PHP 的 Redis 扩展，需先安装 PHP）
#   mode:  source = 用已装 PHP 的 phpize 从源码编译
#   说明:  不再随 PHP 自动安装，改为单独选择/确认后安装。
#          PHP8 建议 6.3.0；PHP7.3 用 5.3.7。
# ---------------------------------------------------------------------------
PHPREDIS_VERSIONS=(
  "6.3.0|source|for=php8"
  "5.3.7|source|for=php7.3"
)
PHPREDIS_DEFAULT="6.3.0"
PHPREDIS_DEFAULT_MODE="source"

# ---------------------------------------------------------------------------
# Memcached （内存对象缓存，Redis 之外的另一种选择）
#   modes:  source = 源码编译(安装到 /usr/local/memcached)   |   pkg = 包管理器安装
#   meta :  min_mem 最低内存(MB)
#   说明 :  只装服务端；PHP 的 memcached 扩展见 PHPMEMCACHED_VERSIONS（独立组件）。
#           安装时会交互询问"是否同时装 PHP memcached 扩展"。
# ---------------------------------------------------------------------------
MEMCACHED_VERSIONS=(
  "1.6.45|source,pkg|min_mem=0"
)
MEMCACHED_DEFAULT="1.6.45"
MEMCACHED_DEFAULT_MODE="source"

# ---------------------------------------------------------------------------
# PHP memcached 扩展（pecl memcached，基于 libmemcached）
#   mode:  source = 用已装 PHP 的 phpize 从源码编译（需 libmemcached-devel）
#   meta :  for = 适用的 PHP 分支（3.x 需 PHP7+；PHP5.6 只能用 2.2.0）
# ---------------------------------------------------------------------------
PHPMEMCACHED_VERSIONS=(
  "3.4.0|source|for=php7+"
  "3.3.0|source|for=php7+"
  "2.2.0|source|for=php5"
)
PHPMEMCACHED_DEFAULT="3.4.0"
PHPMEMCACHED_DEFAULT_MODE="source"

# ---------------------------------------------------------------------------
# Swoole （PHP 协程框架运行时，Hyperf / Laravel Octane 依赖）
#   mode:  source = phpize 编译（需 PHP 8.0+）
#   meta :  php_min 最低 PHP 版本
#   说明 :  Swoole 6.x 要求 PHP >= 8.0；PHP 5.6/7.x 用户请勿选择。
# ---------------------------------------------------------------------------
SWOOLE_VERSIONS=(
  "6.2.3|source|php_min=8.0"
  "6.1.10|source|php_min=8.0"
)
SWOOLE_DEFAULT="6.2.3"
SWOOLE_DEFAULT_MODE="source"

# ---------------------------------------------------------------------------
# Composer （PHP 依赖管理器，单文件 phar）
#   mode:  phar = 下载官方 composer.phar 并校验 SHA256
#   meta :  php_min / php_max 适用的 PHP 范围
#   说明 :  2.x 需 PHP >= 7.2.5；PHP 5.6~7.1 请选 2.2.x LTS。
# ---------------------------------------------------------------------------
COMPOSER_VERSIONS=(
  "2.10.3|phar|php_min=7.2.5"
  "2.2.30|phar|php_min=5.3;php_max=7.1"
)
COMPOSER_DEFAULT="2.10.3"
COMPOSER_DEFAULT_MODE="phar"

# ---------------------------------------------------------------------------
# Node.js （官方二进制包，含 npm/npx/corepack）
#   mode:  binary = nodejs.org 官方预编译包(tar.xz)
#   meta :  lts 代号 ; status=active-lts|maintenance
# ---------------------------------------------------------------------------
NODE_VERSIONS=(
  "24.22.1|binary|lts=krypton;status=active-lts"
  "22.23.4|binary|lts=jod;status=maintenance"
  "16.20.2|binary|lts=gallium;status=maintenance"
)
NODE_DEFAULT="24.22.1"
NODE_DEFAULT_MODE="binary"
# 旧 glibc（<2.28，如 CentOS 7 的 2.17）上的回落版本：Node 18+ 官方二进制跑不起来。
# 16.20.x 是最后一个支持 glibc 2.17 的系列。菜单与 CLI --nodejs 都用它。
NODE_FALLBACK_OLDGLIBC="16.20.2"

# ---------------------------------------------------------------------------
# fail2ban （防暴力破解，包管理器安装）
#   mode:  pkg = 发行版仓库/EPEL
#   说明 :  具体版本随发行版仓库而定（EPEL 通常落后上游），1.1.1 为参考版本；
#           装完会打印实际版本。
#           三个 jail：sshd / nginx-http-auth / nginx-limit-req。
# ---------------------------------------------------------------------------
FAIL2BAN_VERSIONS=(
  "1.1.1|pkg|repo=auto"
)
FAIL2BAN_DEFAULT="1.1.1"
FAIL2BAN_DEFAULT_MODE="pkg"

# ---------------------------------------------------------------------------
# 下载镜像 (Download mirrors) —— 仅作官方源不可达时的回落(见 lib/common.sh fetch)
#   优先级: 本地缓存 packages/ → 官方源(各模块内的官方URL) → MIRROR_PRIMARY → MIRROR_FALLBACK
# ---------------------------------------------------------------------------
MIRROR_PRIMARY="https://www.zhangfangzhou.cn/third"
MIRROR_FALLBACK="http://arv.asuhu.com/ftp"

# 安装根目录 (install prefixes)
PREFIX_NGINX="/usr/local/nginx"
PREFIX_APACHE="/usr/local/apache"
PREFIX_PHP="/usr/local/php"
# 数据库存放在 /data（basedir=/data/mysql, datadir=/data/mysql/data；
# pid/log_error/slow_query_log 自动落到 datadir 下）。MySQL 与 MariaDB 互斥，
# 分别用 /data/mysql 与 /data/mariadb，互不干扰。
PREFIX_MYSQL="/data/mysql"
PREFIX_MARIADB="/data/mariadb"
PREFIX_REDIS="/usr/local/redis"
PREFIX_MEMCACHED="/usr/local/memcached"
PREFIX_NODE="/usr/local/node"
MEMCACHED_PORT=11211
# php-fpm 监听方式：使用 Unix socket（比 127.0.0.1:9000 更安全、性能更好）
PHP_FPM_SOCK="/run/php/php-fpm.sock"
WWWROOT="/home/wwwroot"
WWWLOGS="/home/wwwlogs"

# ---------------------------------------------------------------------------
# 内核参数 / 句柄上限调优 (modules/sysctl.sh)
#   三个落地路径都可用同名环境变量覆盖 —— 测试把它们指到临时目录，
#   就不会碰到宿主机的 /etc。
# ---------------------------------------------------------------------------
SYSCTL_CONF="${SYSCTL_CONF:-/etc/sysctl.d/99-lnamp.conf}"
LIMITS_CONF="${LIMITS_CONF:-/etc/security/limits.d/99-lnamp.conf}"
SYSTEMD_LIMITS_CONF="${SYSTEMD_LIMITS_CONF:-/etc/systemd/system.conf.d/99-lnamp.conf}"
SYSCTL_NOFILE="${SYSCTL_NOFILE:-65535}"
SYSCTL_NPROC="${SYSCTL_NPROC:-65535}"

# ---------------------------------------------------------------------------
# 国内镜像 (Composer / npm) —— 只改包索引地址，不碰下载源(MIRROR_*)
#   --mirror cn|official|none   或   install.sh mirror [cn|official]
# ---------------------------------------------------------------------------
COMPOSER_MIRROR_CN="https://mirrors.aliyun.com/composer/"
COMPOSER_MIRROR_TX="https://mirrors.cloud.tencent.com/composer/"
NPM_REGISTRY_CN="https://registry.npmmirror.com"
MIRROR_MODE="${MIRROR_MODE:-cn}"   # cn|official|none
